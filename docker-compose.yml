services:
  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - WATCHFILES_POLL_DELAY_MS=300
    volumes:
      - ./:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - FRONTEND_PROXY_TARGET=http://api:8000
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  streamlit:
    build: .
    command: streamlit run backend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - backend/.env
    volumes:
      - ./:/app

  voice-worker:
    build:
      context: .
      dockerfile: voice_worker/Dockerfile
    command: uvicorn voice_worker.app.main:app --host 0.0.0.0 --port 8010 --reload
    ports:
      - "8010:8010"
    environment:
      - VOICE_WORKER_PROVIDER=mock
      - WATCHFILES_FORCE_POLLING=true
      - WATCHFILES_POLL_DELAY_MS=300
    volumes:
      - ./:/app

volumes:
  frontend_node_modules:
